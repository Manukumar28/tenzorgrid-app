    <filter id="at-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#at-bg)"/>
  <circle cx="700" cy="90" r="130" fill="#35E7C6" opacity=".28" filter="url(#at-blur)"/>
