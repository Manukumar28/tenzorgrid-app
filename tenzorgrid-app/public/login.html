<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — TenzorGrid</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="logo" href="/" style="margin-bottom:22px;justify-content:center;"><img src="/assets/icon.svg" alt="TenzorGrid"> <span class="logo-word">Tenzor<span class="g">Grid</span></span></a>
    <h2 style="margin:0 0 4px;font-size:19px;">Welcome back</h2>
    <p style="margin:0 0 20px;font-size:13.5px;color:var(--text-soft);">Log in to your account.</p>
    <div class="error-box" id="err"></div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log in</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-soft);">
      New here? <a href="/signup.html" style="color:var(--primary);font-weight:600;">Create an account</a>
    </div>
  </div>
</div>
<script>
const form = document.getElementById('loginForm');
const errBox = document.getElementById('err');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');

    const me = await fetch('/api/me').then(r => r.json());
    window.location.href = me.hasProfile ? '/dashboard.html' : '/welcome.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
